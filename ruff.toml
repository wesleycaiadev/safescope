target-version = "py314"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "SIM",  # flake8-simplify
    "TCH",  # type checking imports
    "B",    # flake8-bugbear
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert used — we use it in tests
    "S311",  # random — we use secrets for crypto, random for jitter
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[lint.isort]
known-first-party = ["safescope_core", "safescope_scanners", "safescope_report"]
